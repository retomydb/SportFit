name: Test SportFit backend
on:
  push:
    paths: ['src/**', 'pom.xml', '.github/workflows/test.yml']
  pull_request:
    paths: ['src/**', 'pom.xml', '.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - run: node --check src/main/resources/static/app.js
