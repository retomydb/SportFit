server.port=${PORT:8087}
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/sportfit;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
server.error.include-message=never
spring.jackson.serialization.write-dates-as-timestamps=false

debug=false
logging.level.root=INFO

sportfit.storage=${SPORTFIT_STORAGE:h2}
sportfit.github.token=${SPORTFIT_GITHUB_TOKEN:}
sportfit.github.repository=${SPORTFIT_GITHUB_REPOSITORY:retomydb/SportFit}
sportfit.github.branch=${SPORTFIT_GITHUB_BRANCH:main}
sportfit.github.encryption-key=${SPORTFIT_DATA_KEY:}
sportfit.allowed-origins=${SPORTFIT_ALLOWED_ORIGINS:http://localhost:8087,http://127.0.0.1:8087}
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
